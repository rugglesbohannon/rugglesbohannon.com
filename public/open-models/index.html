<script>
const stages=[
{label:'Shared foundations',caption:'Shared models are the fastest way to start. They are also a one-way channel for whatever you type into them.',plain:{title:'Start on shared models, and know what you are giving up.',paragraphs:[`A chemist once described feeding his own proprietary chemistry into a frontier model to speed up his work. In the next release, the model suggested his idea back to him. His information went in as prompts, settled into the model's weights, and came back out as a capability anyone could use.`,`That is the risk every company takes when it builds on shared models. Each token you spend teaches the provider's system a little more about how your business works. For most early work the trade is worth it. Shared research, open tools, and licensed knowledge are the roots of this tree, and a managed frontier model is the quickest way to find out what AI can do for you.`,`The rest of this page is about when that trade stops being worth it. Use shared capability to get started. Then decide which knowledge and controls your company must keep as it builds its own system. The question to ask is what stays yours. Both paths can run at the same time.`],takeaway:'From shared capability to company-owned knowledge.'},expert:{title:'Treat frontier usage as a disclosure channel.',paragraphs:[`The failure mode is specific. Proprietary context entered through prompts, tool calls, and uploaded files can land in a provider's training corpus, shape its preference data, or be distilled into a later release. The chemist's case is the clean example: a subsequent model version proposed his own method back to him. Once knowledge is in the weights it cannot be retrieved, attributed, or revoked.`,`The roots are public research, open tooling, and licensed knowledge. Building the first application on managed frontier inference is still the right move, because it isolates workflow value from serving complexity. Treat that usage as a one-way disclosure channel from day one: classify what enters prompts, log it, and decide early which categories of information must never leave the company.`,`In architectural terms the tree is a shared-capability trunk that forks into provider-managed inference on one side and a company-governed learning loop on the other. The fork happens one workload at a time, so the steady state is a hybrid. The work is deciding where each workload belongs and what crosses the boundary.`],takeaway:'Shared models are a search tool. Budget for the disclosure they require.'}},
{label:'Explore → prototype',caption:'Every company climbs the same trunk: exploration, then a prototype, then proven value.',plain:{title:'Everyone starts on the trunk.',paragraphs:[`No company begins by building its own system. You begin on the frontier, because you do not yet know what is worth building. The trunk runs from exploration to a working prototype to proven value, and every company climbs it, including the ones that later run models of their own.`,`Look for specific tasks where someone can judge the output and the system makes their work faster. Try the workflow, watch where it fails, and count the time people spend fixing what it produces. The target is repeated, useful work.`,`While you are here, pay attention to what you are typing in. Early prototypes are usually built on general problems. The moment they start working, people begin feeding them the specific things: how the company actually does the job, what a particular customer wants, which shortcuts work. That is where the next stage begins.`]},expert:{title:'Use frontier breadth to find bounded workloads.',paragraphs:[`Frontier models are the cheapest search tool for workloads with positive task economics: a stable task definition, evaluable outputs, and an integration path into an existing process. Prototype against a representative input distribution and measure acceptance rate, latency, review effort, and cost per accepted result, including retries and downstream corrections.`,`Keep the serving layer trivial. Versioned prompts, a thin API wrapper, and logged inputs and outputs are enough. Workflow ROI has to be demonstrated before the inference stack deserves any optimization. Task definition is where most prototypes fail.`,`Instrument the content as well as the metrics. Tag prompts by sensitivity class as they are written: public, internal, proprietary method, customer-specific. The shift from generic to proprietary context is gradual and invisible after the fact. A sensitivity log is how you later recognize that the system has started absorbing the knowledge that differentiates the company.`]}},
{label:'Prove value',caption:'Value is proven when the workflow is relied upon and its improvement comes from what the company taught it.',plain:{title:'Notice when the knowledge becomes the advantage.',paragraphs:[`Once a workflow works, pay attention to why it keeps getting better. Employees correct the same mistakes until they stop happening. Unwritten methods get written down. Customer details change what a good answer looks like. The system now depends on things only your company could have taught it.`,`This is tribal knowledge: how your industry really operates, how to write for your customers, who to talk to, which steps matter and which are ceremony. It rarely lives in a document. It is the reason a competitor using the same model would get a worse answer.`,`A simple test for proven value: people use the workflow without being asked, the quality is measurably improving, and the improvement traces back to your own corrections. When all three hold, the knowledge is the asset. Preserve it deliberately, including the reasons behind each correction. The asset is a reviewed record of what changed and why.`],takeaway:'Value is proven when the gains come from your feedback, and that feedback is now the thing worth protecting.'},expert:{title:'Attribute the gains to company-specific context.',paragraphs:[`Establish a versioned evaluation set, reviewed failure cases, and feedback provenance. Then run ablations. Separate base-model capability from gains attributable to company context, the retrieval corpus, encoded procedures, or fine-tuning data. If removing company context collapses performance, the asset is the context, and the model is a commodity around it.`,`A working definition of proven value: sustained production usage; acceptance rate and review effort stable or improving across at least one base-model upgrade; and improvement attributable mostly to curated company feedback. The third condition is what makes the asset worth protecting, because it means the provider's model is now learning from examples it could not have generated on its own.`,`The asset includes formal IP and institutional knowledge: domain decision rules, operating constraints, expert judgment, customer-specific conventions, and the people and channels that make work move. Curate it, control access, and track lineage. Every example that flows through a shared endpoint is a labeled sample a provider could learn from, so the volume of proprietary traffic is itself a signal that the branch point is approaching.`],takeaway:'Measure how much of the performance is yours. That number decides the next stage.'}},
{label:'Choose what you control',caption:'The branch stops being optional when proven value, proprietary knowledge, and distrust of vendor promises all line up.',plain:{title:'Recognize the branch point.',paragraphs:[`The circle in the tree is where a company decides to stop sharing. Up to this point, everything went through someone else's model. From here, one path keeps renting frontier capability and the other builds a system the company controls. You make the choice one workflow at a time.`,`Three conditions make the owned branch stop being optional. The workflow has proven its value. The system is now absorbing your proprietary methods and customer knowledge. And you do not trust that knowledge to stay yours once it leaves. When all three are true, the investment is justified even if it costs several times more per token, because the premium is buying the thing that makes you different.`,`On the third condition: providers publish commitments not to train on business data and offer zero-data-retention options. These are contractual promises with eligibility rules, feature exceptions, and separate carve-outs for abuse monitoring. You cannot audit what happens inside a provider's training pipeline. Read the terms, then decide how much of your advantage you are willing to rest on them. <a href="#sources">Provider sources ↓</a>`],takeaway:'Branch when the knowledge you are feeding in is the thing that makes you different.'},expert:{title:'Price control into the migration decision.',paragraphs:[`Migration is an architectural decision for a proven workload. The trigger is the conjunction of three signals: attributable proprietary gains from the ablations in the previous stage, a sensitivity log showing proprietary context in production prompts, and a risk posture that does not accept unverifiable external processing of that context.`,`On vendor controls: zero data retention has eligibility requirements and endpoint-specific exceptions. Training opt-out, application-state retention, abuse-monitoring retention, and third-party tool processing are distinct policies with distinct scopes. Even where every control applies, enforcement is contractual and unauditable from the customer side. Treat these controls as risk reduction on the frontier branch. The owned branch needs a boundary you control. <a href="#sources">Provider sources ↓</a>`,`On cost: a several-fold per-token premium for open inference can be rational. Compare end-to-end TCO and accepted-output quality, then explicitly value deployability, version pinning, customization, and continuity. Add the option value of not contributing labeled proprietary examples to a future model that your competitors will also rent. That last term is hard to price and is usually the one that decides.`],takeaway:'Migrate when attributable proprietary gain, confirmed proprietary egress, and unacceptable residual risk coincide.'}},
{label:'A distinct learning branch',caption:'Research, methods, procedures, and customer knowledge compound into a system that improves only on your feedback.',plain:{title:'Build the branch around what you know.',paragraphs:[`The right side of the tree holds what the company chooses to control: research findings, engineering methods, operating procedures, and customer knowledge. This is the material that has to stay on your side of the line. It is the accumulated judgment of the people who do the work.`,`Over time it becomes a distinct learning branch: a system that retains private knowledge and improves on your own feedback, with no other company's model in the loop. Every correction makes your system better and no one else's. That is the whole point of the branch.`,`"Going open" can mean several different things, and the difference matters. An open-weight model is one you run yourself and whose parameters you can keep and modify. Retrieval gives a model your documents at request time without changing the model. Fine-tuning teaches it a stable behavior through additional training. Most owned branches use retrieval for facts that change and consider fine-tuning for behaviors that stay the same. Check the license before assuming a model gives you the control you need. <a href="#sources">Definitions and technical sources ↓</a>`]},expert:{title:'Own the data plane and the adaptation loop.',paragraphs:[`Separate the knowledge layer from model parameters. Source documents, access policy, retrieval indexes, evaluation sets, and feedback lineage all sit under company governance as portable application state. The governed corpus and the improvement loop are the asset, and any model you serve can be swapped out.`,`Define the mechanics explicitly. Retrieval-augmented generation over governed data against an open-weight model you serve covers changing facts and source-grounded answers. Parameter-efficient fine-tuning with adapters on curated feedback covers stable task behavior, and must be tested against a held-out baseline. Full fine-tuning or continued pretraining is justified only where domain shift is large and data volume supports it. The split between retrieval and training follows the split between facts and behavior in the asset. Weights should never be the only record of institutional knowledge.`,`Open weights provide parameter access under license. OSI-defined open-source AI additionally requires modification-enabling code and training-data information. Before committing, assess license restrictions on commercial use and derivative distribution, artifact availability including tokenizer and adapter formats, and compatibility with the serving stack you intend to operate. <a href="#sources">Definitions and technical sources ↓</a>`]}},
{label:'Cloud or on premises',caption:'Owning the branch means controlling the knowledge and the learning loop, wherever the hardware sits.',plain:{title:'The owned branch can run in the cloud.',paragraphs:[`The owned branch is defined by who controls the knowledge and the learning loop. You can run an open model on rented cloud hardware and still keep every document, correction, and weight under your control. The tree leaves deployment open because it is a separate decision.`,`Move one established task first. Run the open model alongside the existing system, compare the results on the hard cases, and shift responsibility only when quality holds and a named person owns security, maintenance, and performance.`,`Count human review and engineering time alongside the infrastructure bill. Owning a deployment is worthwhile when the company can operate it competently and keep improving it from its own feedback. If no one can own it, the branch is not ready, however good the model is.`]},expert:{title:'Validate the serving and operating model.',paragraphs:[`Deployment is orthogonal to governance. Self-hosting an inference server on rented accelerators inside your own cloud account, dedicated managed inference running a customer-controlled model artifact, and on-premises hardware each satisfy different isolation, retention, and availability requirements. Choose on those requirements. An owned branch running in a public cloud region is still owned if the weights, the corpus, and the feedback never leave your control.`,`Shadow one bounded workload before shifting production traffic. Compare task success, failure severity, latency, review effort, and cost per accepted output against the frontier baseline. Set rollout thresholds and keep a tested fallback, including a routing path back to a frontier endpoint for inputs classified as non-sensitive.`,`Budget accelerator utilization, serving engineering, observability, patching, and incident response as recurring costs. Version model artifacts, adapters, prompts, retrieval indexes, and evaluation sets together, and re-run the evaluation suite on every change. A deployment does not retain its original quality by default.`]}},
{label:'Both branches continue',caption:'Keep the frontier where raw capability matters more than ownership. The two paths coexist.',plain:{title:'Keep the frontier where it earns its place.',paragraphs:[`The left branch keeps growing. Medicine, science, engineering, and commerce are the edge cases where the frontier stays necessary: some problems need the most capable model available, some tasks are too small to deserve their own infrastructure, and some involve nothing you would mind a provider learning. Where raw capability matters more than ownership, keep renting it.`,`The two paths coexist. A company can run a fully owned branch for its core workflow and still use frontier models for everything else. The ongoing work is deciding, task by task, what information may cross the line and keeping an exit path for the work that stays on the shared side.`,`Watch for the moment a useful system starts accumulating knowledge you would hate to lose, or hate to see surface in someone else's next release. Use the frontier to find the opportunity. Then decide where those lessons should keep developing.`],takeaway:'Use shared capability to get started. Keep what makes you different on a branch you control.'},expert:{title:'Run a deliberate hybrid.',paragraphs:[`Retain managed frontier inference where the capability gap, variable demand, or operating economics favor it. A fully open execution path for a proprietary workflow coexists with closed models elsewhere in the enterprise, and policy sets the boundary between them.`,`Define routing and data-egress policy per workload, with sensitivity class determining the endpoint. Maintain portable source assets and tested provider interfaces while recognizing that model behavior is not interchangeable. Any provider switch, in either direction, requires regression evaluation against the versioned suite.`,`Revisit the split as workload value, attributable proprietary learning, and operational maturity change. Adopt open models where control over the improvement loop justifies the cost. Keep frontier services where their performance or economics remain stronger and the disclosure is acceptable. Treat the tree as a standing decision and revisit it.`],takeaway:'Own the improvement loop where it differentiates you. Evaluate every other inference dependency on its merits.'}}
];
let mode='plain',active=0,frame=0;
const story=document.getElementById('story');
const refs=`<details class="sources" id="sources"><summary>Sources & further reading</summary><ol><li><a href="original-diagram.png" target="_blank" rel="noopener">Original diagram</a></li><li><a target="_blank" rel="noopener" href="https://openai.com/enterprise-privacy/">OpenAI: business data and training commitments</a></li><li><a target="_blank" rel="noopener" href="https://developers.openai.com/api/docs/guides/your-data">OpenAI: retention controls, ZDR eligibility, and feature limitations</a></li><li><a target="_blank" rel="noopener" href="https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training">Anthropic: commercial data and model training</a></li><li><a target="_blank" rel="noopener" href="https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html">AWS: retrieval versus fine-tuning</a></li><li><a target="_blank" rel="noopener" href="https://opensource.org/ai/open-source-ai-definition">OSI: the Open Source AI Definition</a></li><li><a target="_blank" rel="noopener" href="https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html">AWS: importing customized models into managed infrastructure</a></li></ol><p class="end-note">Provider terms and product capabilities can change. Reviewed October 2026.</p></details>`;
const wordsPerMinute={plain:230,expert:180};
function readMinutes(m){const words=stages.reduce((n,s)=>{const t=s[m];return n+[t.title,...t.paragraphs,t.takeaway||''].join(' ').replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length},0);return Math.max(1,Math.round(words/wordsPerMinute[m]))}
const treeSvg=document.querySelector('.visual .tree');
const treeMarkup=treeSvg.innerHTML.replace(/<title[\s\S]*?<\/desc>/,'').replace(/ role="link" tabindex="0"| aria-label="[^"]*"/g,'');
const cropBoxes=[];
function cropBox(i){if(cropBoxes[i])return cropBoxes[i];const b=treeSvg.querySelector(`.group[data-stage="${i}"]`).getBBox();const pad=18,w=Math.min(600,Math.max(b.width+pad*2,300)),h=Math.min(520,Math.max(b.height+pad*2,150));const x=Math.min(Math.max(b.x+b.width/2-w/2,0),600-w),y=Math.min(Math.max(b.y+b.height/2-h/2,78),598-h);return cropBoxes[i]=[x,y,w,h].map(Math.round).join(' ')}
let treeTextBoxes;
function trimCropLabels(){treeTextBoxes=treeTextBoxes||[...treeSvg.querySelectorAll('text')].map(t=>t.getBBox());story.querySelectorAll('.crop svg').forEach(svg=>{const [x,y,w,h]=svg.getAttribute('viewBox').split(' ').map(Number);const texts=[...svg.querySelectorAll('text')],out=treeTextBoxes.filter(b=>b.x<x||b.y<y||b.x+b.width>x+w||b.y+b.height>y+h);texts.forEach((t,j)=>{const b=treeTextBoxes[j];if(out.some(o=>Math.abs(o.x-b.x)<1&&Math.abs(o.y-b.y)<18))t.remove()})})}
function crop(i){if(i===0)return '';const markup=treeMarkup.replace(/<g class="group[^"]*" data-stage="(\d)"/g,(m,s)=>{const n=Number(s);return `<g class="group${n===i||(i===6&&[3,4,5].includes(n))?' lit':''}${n===i?' focus':''}" data-stage="${n}"`});return `<figure class="crop" aria-hidden="true"><svg class="tree" viewBox="${cropBox(i)}">${markup}</svg></figure>`}
function render(){document.getElementById('read-time').textContent=`${readMinutes(mode)} min read`;story.innerHTML='<p class="byline">Ruggles Bohannon - Oct 30, 2026</p>'+stages.map((stage,i)=>{const text=stage[mode];return `<section class="chapter${i===active?' active':''}" id="stage-${i}" data-index="${i}" aria-labelledby="title-${i}">${crop(i)}<h2 id="title-${i}">${text.title}</h2>${text.paragraphs.map(p=>`<p>${p}</p>`).join('')}${text.takeaway?`<p class="takeaway">${text.takeaway}</p>`:''}</section>`}).join('')+refs;trimCropLabels();story.querySelectorAll('a[href="#sources"]').forEach(a=>a.addEventListener('click',()=>{document.getElementById('sources').open=true}));}
function setActive(index){active=index;document.querySelectorAll('.chapter').forEach((e,i)=>e.classList.toggle('active',i===index));treeSvg.querySelectorAll('.group').forEach(g=>{let n=Number(g.dataset.stage);g.classList.toggle('lit',n===index||(index===6&&[3,4,5].includes(n)));g.classList.toggle('focus',n===index)});}
const phone=matchMedia('(max-width:600px)');const visual=document.querySelector('.visual');
function readingTop(){return phone.matches?0:story.getBoundingClientRect().top}
function activationLine(){return phone.matches?innerHeight*.3:readingTop()+Math.max(60,story.clientHeight*.25)}
function scrollByDelta(delta,behavior){if(phone.matches)window.scrollTo({top:scrollY+delta,behavior});else story.scrollTo({top:story.scrollTop+delta,behavior})}
function track(){frame=0;let closest=0,distance=Infinity;document.querySelectorAll('.chapter').forEach((e,i)=>{let r=e.getBoundingClientRect();let d=Math.abs(r.top-activationLine());if(r.top<=activationLine()&&r.bottom>=activationLine()){closest=i;distance=-1}else if(distance!==-1&&d<distance){closest=i;distance=d}});if(active!==closest)setActive(closest)}
function go(index){const target=index===0?story.firstElementChild:document.getElementById(`stage-${index}`);scrollByDelta(target.getBoundingClientRect().top-readingTop(),matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth');setActive(index)}
treeSvg.querySelectorAll('.group').forEach(g=>{g.addEventListener('click',()=>go(Number(g.dataset.stage)));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(Number(g.dataset.stage))}})});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{if(mode===b.dataset.mode)return;const current=document.getElementById(`stage-${active}`);const rect=current.getBoundingClientRect();const fraction=Math.min(1,Math.max(0,(activationLine()-rect.top)/rect.height));mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const selected=active;render();setActive(selected);requestAnimationFrame(()=>{const updated=document.getElementById(`stage-${selected}`);scrollByDelta(updated.getBoundingClientRect().top+fraction*updated.offsetHeight-activationLine(),'instant');setActive(selected)});history.replaceState(null,'',`#${mode}-${selected+1}`)}));
const saved=location.hash.match(/^#(plain|expert)-([1-7])$/);if(saved){mode=saved[1];active=Number(saved[2])-1;document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
render();setActive(active);const onScroll=()=>{if(!frame)frame=requestAnimationFrame(track)};story.addEventListener('scroll',onScroll,{passive:true});addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);if(saved&&Number(saved[2])>1)requestAnimationFrame(()=>go(Number(saved[2])-1));
</script>
